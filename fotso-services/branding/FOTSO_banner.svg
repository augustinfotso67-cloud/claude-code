<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="384" viewBox="0 0 1920 384">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0a2540"/>
      <stop offset="50%" stop-color="#06182e"/>
      <stop offset="100%" stop-color="#0a2540"/>
    </linearGradient>
    <linearGradient id="curve" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#facc15" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#fde047"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#fde047" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#fde047" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1920" height="384" fill="url(#bg)"/>

  <!-- Grille -->
  <g stroke="#13304a" stroke-width="1.5" opacity="0.6">
    <line x1="200" y1="60" x2="200" y2="324"/>
    <line x1="400" y1="60" x2="400" y2="324"/>
    <line x1="600" y1="60" x2="600" y2="324"/>
    <line x1="800" y1="60" x2="800" y2="324"/>
    <line x1="100" y1="120" x2="900" y2="120"/>
    <line x1="100" y1="200" x2="900" y2="200"/>
    <line x1="100" y1="280" x2="900" y2="280"/>
  </g>

  <!-- Glow final -->
  <circle cx="880" cy="100" r="100" fill="url(#glow)"/>

  <!-- Courbe d'équité large -->
  <path d="M 110 305 L 200 290 L 290 295 L 380 250 L 470 260 L 560 200 L 650 215 L 740 150 L 830 130 L 880 100"
        fill="none" stroke="url(#curve)" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Points-clés -->
  <circle cx="380" cy="250" r="5" fill="#facc15" opacity="0.8"/>
  <circle cx="650" cy="215" r="5" fill="#facc15" opacity="0.8"/>
  <circle cx="880" cy="100" r="16" fill="#fde047"/>
  <circle cx="880" cy="100" r="7" fill="#0a2540"/>

  <!-- Bloc texte droite -->
  <text x="1050" y="160" font-family="Helvetica, Arial, sans-serif" font-size="80"
        font-weight="800" letter-spacing="4" fill="#e8e6e0">FOTSO COMPANY</text>
  <rect x="1050" y="180" width="170" height="3" fill="#facc15"/>
  <text x="1050" y="225" font-family="Helvetica, Arial, sans-serif" font-size="28"
        font-weight="500" letter-spacing="6" fill="#facc15">QUANT · AUDIT · RESEARCH</text>
  <text x="1050" y="275" font-family="Helvetica, Arial, sans-serif" font-size="22"
        font-weight="400" fill="#a8b8ce">Anti-overfit. Anti-gourou. Données d'abord.</text>
</svg>
