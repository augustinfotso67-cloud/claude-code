<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a2540"/>
      <stop offset="100%" stop-color="#06182e"/>
    </linearGradient>
    <linearGradient id="curve" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#facc15" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#fde047"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#fde047" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#fde047" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="512" height="512" fill="url(#bg)"/>

  <!-- Grille discrète -->
  <g stroke="#13304a" stroke-width="1.5" opacity="0.7">
    <line x1="80" y1="140" x2="80" y2="380"/>
    <line x1="160" y1="140" x2="160" y2="380"/>
    <line x1="240" y1="140" x2="240" y2="380"/>
    <line x1="320" y1="140" x2="320" y2="380"/>
    <line x1="400" y1="140" x2="400" y2="380"/>
    <line x1="60" y1="180" x2="430" y2="180"/>
    <line x1="60" y1="260" x2="430" y2="260"/>
    <line x1="60" y1="340" x2="430" y2="340"/>
  </g>

  <!-- Axes -->
  <line x1="60" y1="380" x2="430" y2="380" stroke="#1f4870" stroke-width="2"/>
  <line x1="60" y1="140" x2="60" y2="380" stroke="#1f4870" stroke-width="2"/>

  <!-- Glow point final -->
  <circle cx="410" cy="155" r="60" fill="url(#glow)"/>

  <!-- Courbe d'équité ascendante -->
  <path d="M 70 365 L 110 355 L 145 360 L 180 335 L 215 340 L 250 295 L 285 305 L 320 245 L 355 220 L 390 175 L 410 155"
        fill="none" stroke="url(#curve)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Points-clés discrets -->
  <circle cx="180" cy="335" r="4" fill="#facc15" opacity="0.8"/>
  <circle cx="285" cy="305" r="4" fill="#facc15" opacity="0.8"/>
  <circle cx="410" cy="155" r="14" fill="#fde047"/>
  <circle cx="410" cy="155" r="6" fill="#0a2540"/>

  <!-- Lettre F en filigrane -->
  <text x="105" y="260" font-family="Helvetica, Arial, sans-serif" font-size="120"
        font-weight="800" fill="#e8e6e0" opacity="0.12" text-anchor="middle">F</text>

  <!-- Texte FOTSO COMPANY -->
  <text x="256" y="445" font-family="Helvetica, Arial, sans-serif" font-size="38"
        font-weight="700" letter-spacing="8" fill="#e8e6e0" text-anchor="middle">FOTSO COMPANY</text>

  <!-- Tagline -->
  <text x="256" y="475" font-family="Helvetica, Arial, sans-serif" font-size="14"
        font-weight="500" letter-spacing="6" fill="#facc15" text-anchor="middle" opacity="0.85">QUANT · AUDIT · RESEARCH</text>
</svg>
