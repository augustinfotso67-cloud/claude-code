<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Trading Algo Office — Bureau virtuel</title>
<style>
  :root {
    --orange: #D77757;
    --blue: #5769F7;
    --bg: #1a1410;
    --bg-2: #221913;
    --surface: #2a1f1a;
    --surface-2: #352720;
    --text: #ebdcc8;
    --text-muted: #8a7c6c;
    --border: rgba(215, 119, 87, 0.25);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    overflow: hidden;
    font-feature-settings: "cv02", "cv03", "cv04", "cv11";
  }
  #canvas { display: block; }

  /* Header */
  .header {
    position: absolute; top: 0; left: 0; right: 0;
    padding: 18px 24px;
    display: flex; justify-content: space-between; align-items: center;
    pointer-events: none;
    z-index: 10;
    background: linear-gradient(180deg, rgba(0,0,0,0.4) 0%, rgba(0,0,0,0) 100%);
  }
  .header .brand { display: flex; flex-direction: column; }
  .header h1 { font-size: 15px; font-weight: 600; letter-spacing: 0.3px; }
  .header h1 .accent { color: var(--orange); }
  .header .sub { font-size: 11px; color: var(--text-muted); margin-top: 2px; }
  .header .stats {
    font-size: 12px; color: var(--text-muted);
    background: rgba(42, 31, 26, 0.6);
    backdrop-filter: blur(8px);
    padding: 8px 14px; border-radius: 20px;
    border: 1px solid var(--border);
    pointer-events: auto;
  }
  .header .stats b { color: var(--orange); font-weight: 600; }

  /* Legend */
  .legend {
    position: absolute;
    bottom: 24px; left: 24px;
    background: rgba(42, 31, 26, 0.85);
    backdrop-filter: blur(10px);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 18px;
    font-size: 11px;
    z-index: 10;
    min-width: 160px;
  }
  .legend .title { font-size: 10px; text-transform: uppercase; letter-spacing: 1.2px; color: var(--text-muted); margin-bottom: 8px; }
  .legend .item { display: flex; align-items: center; gap: 10px; margin: 5px 0; }
  .legend .dot { width: 8px; height: 8px; border-radius: 50%; }
  .dot.green { background: #6dcc92; box-shadow: 0 0 8px #6dcc92; }
  .dot.orange { background: #e0a050; box-shadow: 0 0 8px #e0a050; }
  .dot.red { background: #d96565; box-shadow: 0 0 8px #d96565; }
  .dot.grey { background: #5a4f47; }

  /* Side panel */
  .panel {
    position: absolute;
    top: 70px; right: 24px;
    width: 380px;
    max-height: calc(100vh - 100px);
    background: rgba(42, 31, 26, 0.96);
    backdrop-filter: blur(14px);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 0;
    overflow: hidden;
    transform: translateX(120%);
    transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    z-index: 20;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    display: flex; flex-direction: column;
  }
  .panel.open { transform: translateX(0); }
  .panel .panel-head {
    padding: 22px 24px 18px;
    border-bottom: 1px solid rgba(215, 119, 87, 0.15);
    position: relative;
  }
  .panel .close {
    position: absolute; top: 16px; right: 18px;
    background: none; border: none; color: var(--text-muted);
    font-size: 24px; cursor: pointer; line-height: 1;
    width: 28px; height: 28px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.2s;
  }
  .panel .close:hover { color: var(--text); background: rgba(255,255,255,0.05); }
  .panel .panel-body {
    padding: 18px 24px 24px;
    overflow-y: auto;
    flex: 1;
  }
  .panel .avatar {
    width: 56px; height: 56px;
    border-radius: 14px;
    display: flex; align-items: center; justify-content: center;
    font-size: 20px; font-weight: 600;
    color: white;
    margin-bottom: 14px;
    letter-spacing: 0.5px;
  }
  .panel h2 { font-size: 19px; font-weight: 600; margin-bottom: 3px; letter-spacing: -0.2px; }
  .panel .role { color: var(--orange); font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase; font-weight: 500; }
  .panel .section { margin: 16px 0; }
  .panel .section-title { font-size: 10px; text-transform: uppercase; color: var(--text-muted); letter-spacing: 1.5px; margin-bottom: 8px; font-weight: 500; }
  .panel .section-body { font-size: 13px; line-height: 1.6; color: var(--text); }
  .panel .status-pill {
    display: inline-flex; align-items: center; gap: 8px;
    background: rgba(255,255,255,0.04);
    padding: 6px 12px; border-radius: 20px;
    font-size: 12px;
  }
  .panel .mission {
    background: rgba(215, 119, 87, 0.08);
    border-left: 3px solid var(--orange);
    padding: 12px 14px; border-radius: 6px;
    font-size: 12px; line-height: 1.5;
  }
  .panel .code-chip {
    font-family: 'SF Mono', Menlo, monospace;
    font-size: 11px;
    background: rgba(0,0,0,0.35);
    padding: 8px 12px;
    border-radius: 6px;
    color: var(--orange);
    border: 1px solid rgba(215, 119, 87, 0.15);
    display: inline-block;
  }
  .panel .invoke-btn {
    width: 100%;
    margin-top: 12px;
    background: var(--orange);
    color: white;
    border: none;
    padding: 11px;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    transition: background 0.2s;
  }
  .panel .invoke-btn:hover { background: #c46a4a; }

  .hint {
    position: absolute;
    bottom: 24px; right: 24px;
    font-size: 11px;
    color: var(--text-muted);
    text-align: right;
    background: rgba(42, 31, 26, 0.6);
    backdrop-filter: blur(8px);
    padding: 10px 14px;
    border-radius: 8px;
    border: 1px solid var(--border);
    line-height: 1.6;
  }

  /* Tooltip */
  .tooltip {
    position: fixed;
    pointer-events: none;
    background: rgba(42, 31, 26, 0.96);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 7px 11px;
    border-radius: 8px;
    font-size: 11px;
    opacity: 0;
    transition: opacity 0.15s;
    z-index: 30;
    white-space: nowrap;
    box-shadow: 0 4px 14px rgba(0,0,0,0.4);
  }
  .tooltip .t-name { font-weight: 600; }
  .tooltip .t-role { color: var(--orange); font-size: 10px; margin-top: 1px; }
  .tooltip.show { opacity: 1; }

  /* Loading */
  .loader {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
    background: var(--bg);
    z-index: 100;
    transition: opacity 0.5s;
  }
  .loader .spin {
    width: 40px; height: 40px;
    border: 2px solid var(--surface-2);
    border-top-color: var(--orange);
    border-radius: 50%;
    animation: spin 1s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loader.hidden { opacity: 0; pointer-events: none; }
</style>
</head>
<body>

<div class="loader" id="loader"><div class="spin"></div></div>

<canvas id="canvas"></canvas>

<div class="header">
  <div class="brand">
    <h1>Bureau virtuel — <span class="accent">Trading Algo Team</span></h1>
    <div class="sub">8 agents · open-space</div>
  </div>
  <div class="stats"><b id="busy-count">0</b> en mission · <b id="avail-count">0</b> disponibles</div>
</div>

<div class="legend">
  <div class="title">Statuts</div>
  <div class="item"><span class="dot green"></span> Disponible</div>
  <div class="item"><span class="dot orange"></span> En mission</div>
  <div class="item"><span class="dot red"></span> Alerte</div>
  <div class="item"><span class="dot grey"></span> Off-duty</div>
</div>

<div class="panel" id="panel">
  <div class="panel-head">
    <button class="close" id="close-panel">×</button>
    <div id="panel-head-content"></div>
  </div>
  <div class="panel-body" id="panel-body"></div>
</div>

<div class="tooltip" id="tooltip">

  <div class="t-role"></div>
</div>

<div class="hint">

</div>

// "Trading Algo Team" wall sign
function makeWallSign() {
  const c = document.createElement('canvas');
  c.width = 1024; c.height = 256;
  const ctx = c.getContext('2d');
  ctx.fillStyle = 'rgba(0,0,0,0)';
  ctx.fillRect(0, 0, c.width, c.height);
  ctx.fillStyle = '#D77757';
  ctx.font = 'bold 90px "Helvetica Neue", sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('TRADING ALGO', 512, 110);
  ctx.fillStyle = '#ebdcc8';
  ctx.font = '38px "Helvetica Neue", sans-serif';
  ctx.fillText('— une équipe systématique —', 512, 180);
  const tex = new THREE.CanvasTexture(c);
  const sign = new THREE.Mesh(
    new THREE.PlaneGeometry(10, 2.5),
    new THREE.MeshBasicMaterial({ map: tex, transparent: true })
  );
  sign.position.set(0, 5.5, -16.9);
  scene.add(sign);
}

  mug.castShadow = true;
  group.add(mug);

  // ---- Chair (seat + back + post)
  const chairMat = new THREE.MeshStandardMaterial({ color: 0x1f1c20, roughness: 0.5 });
  const chairSeat = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.12, 0.75), chairMat);
  chairSeat.position.set(0, 0.55, 1.1);
  chairSeat.castShadow = true;
  group.add(chairSeat);

  const chairBack = new THREE.Mesh(new THREE.BoxGeometry(0.8, 1.1, 0.1), chairMat);
  chairBack.position.set(0, 1.1, 1.45);
  chairBack.castShadow = true;
  group.add(chairBack);

  const chairPost = new THREE.Mesh(
    new THREE.CylinderGeometry(0.04, 0.04, 0.45),
    new THREE.MeshStandardMaterial({ color: 0x14100c, metalness: 0.6 })
  );
  chairPost.position.set(0, 0.27, 1.1);
  group.add(chairPost);

  const chairBase = new THREE.Mesh(
    new THREE.CylinderGeometry(0.4, 0.4, 0.06),
    new THREE.MeshStandardMaterial({ color: 0x14100c, metalness: 0.6 })
  );
  chairBase.position.set(0, 0.04, 1.1);
  group.add(chairBase);

  // ---- Avatar : capsule body + sphere head + colored "shirt"
  const avatarGroup = new THREE.Group();
  avatarGroup.position.set(0, 0, 1.1);

  // Hidden when off-duty
  avatarGroup.visible = agent.status !== 'off';

  // Lower body (pants)
  const pants = new THREE.Mesh(
    new THREE.CylinderGeometry(0.22, 0.22, 0.55),
    new THREE.MeshStandardMaterial({ color: 0x1a1a22, roughness: 0.7 })
  );
  pants.position.y = 0.85;
  pants.castShadow = true;
  avatarGroup.add(pants);

  // Torso (shirt with agent color)
  const torso = new THREE.Mesh(
    new THREE.CapsuleGeometry(0.28, 0.45, 4, 12),
    new THREE.MeshStandardMaterial({ color: agent.color, roughness: 0.55 })
  );
  torso.position.y = 1.42;
  torso.castShadow = true;
  avatarGroup.add(torso);

  // Head
  const head = new THREE.Mesh(
    new THREE.SphereGeometry(0.24, 20, 20),
    new THREE.MeshStandardMaterial({ color: agent.skin, roughness: 0.65 })
  );
  head.position.y = 1.92;
  head.castShadow = true;
  avatarGroup.add(head);

  // Hair (slightly darker cap on top)
  const hair = new THREE.Mesh(
    new THREE.SphereGeometry(0.245, 20, 20, 0, Math.PI * 2, 0, Math.PI / 2.4),
    new THREE.MeshStandardMaterial({ color: 0x2a1f15, roughness: 0.8 })
  );
  hair.position.y = 1.93;
  avatarGroup.add(hair);

  interactables.push(torso, head);
  group.add(avatarGroup);

  // ---- Status LED (floating)
  const ledGeo = new THREE.SphereGeometry(0.1, 16, 16);
  const ledMat = new THREE.MeshBasicMaterial({ color: STATUS_COLORS[agent.status] });
  const led = new THREE.Mesh(ledGeo, ledMat);
  led.position.set(0, 2.95, 0);
  group.add(led);
  interactables.push(led);

  const ledLight = new THREE.PointLight(STATUS_COLORS[agent.status], 0.6, 2.5);
  ledLight.position.set(0, 2.95, 0);
  group.add(ledLight);

  // ---- Floating name plate (always faces camera)
  const plate = makeNamePlate(agent);
  plate.position.set(0, 2.55, 0);
  group.add(plate);
  interactables.push(plate);

  // Bookkeeping
  group.userData = { agent, led, ledLight, plate, avatarGroup, torso, head };
  scene.add(group);
  agentMeshes.push(group);

  // Map interactables → group for raycast lookup
  for (const obj of [screen, torso, head, led, plate, deskTop]) {
    obj.userData.agentGroup = group;
  }

  return group;
}

// ============================================================
// Screen canvas (per-agent terminal-style mockup)
// ============================================================
function makeScreenCanvas(agent) {
  const c = document.createElement('canvas');
  c.width = 1024; c.height = 576;
  const ctx = c.getContext('2d');
  // Background
  ctx.fillStyle = '#0d0a08';
  ctx.fillRect(0, 0, c.width, c.height);

  // Window chrome
  ctx.fillStyle = '#1a1410';
  ctx.fillRect(0, 0, c.width, 40);
  // Dots
  ['#ff5f56', '#ffbd2e', '#27c93f'].forEach((col, i) => {
    ctx.fillStyle = col;
    ctx.beginPath();
    ctx.arc(20 + i * 22, 20, 7, 0, Math.PI * 2);
    ctx.fill();
  });
  // Title
  ctx.fillStyle = '#8a7c6c';
  ctx.font = '20px monospace';
  ctx.fillText(`~/trading/${agent.id}`, 110, 28);

  // Accent line
  ctx.fillStyle = '#' + agent.color.toString(16).padStart(6, '0');
  ctx.fillRect(0, 40, c.width, 3);

  // Content
  ctx.font = '20px monospace';
  const role = agent.role;
  ctx.fillStyle = '#' + agent.color.toString(16).padStart(6, '0');
  ctx.fillText(`# ${role}`, 30, 90);
  ctx.fillStyle = '#ebdcc8';
  ctx.fillText(`$ status: ${agent.status}`, 30, 130);
  if (agent.mission) {
    ctx.fillStyle = '#e0a050';
    ctx.fillText(`▸ mission: ${agent.mission.slice(0, 45)}`, 30, 165);
  } else {
    ctx.fillStyle = '#6dcc92';
    ctx.fillText(`▸ idle, awaiting tasks`, 30, 165);
  }

  // Fake terminal lines
  ctx.fillStyle = '#5a4f47';
  ctx.font = '16px monospace';
  const lines = generateFakeTerminal(agent);
  lines.forEach((line, i) => {
    ctx.fillText(line, 30, 220 + i * 26);
  });

  // Cursor blink (just visual hint)
  ctx.fillStyle = '#' + agent.color.toString(16).padStart(6, '0');
  ctx.fillRect(30, 220 + lines.length * 26 + 4, 12, 18);

  return c;
}

// ============================================================
// Name plate (canvas → texture, always faces camera)
// ============================================================
function makeNamePlate(agent) {
  const c = document.createElement('canvas');
  c.width = 384; c.height = 96;
  const ctx = c.getContext('2d');
  ctx.fillStyle = 'rgba(26, 20, 16, 0.92)';
  ctx.roundRect = ctx.roundRect || function(x, y, w, h, r) {
    this.beginPath();
    this.moveTo(x + r, y);
    this.lineTo(x + w - r, y);
    this.quadraticCurveTo(x + w, y, x + w, y + r);
    this.lineTo(x + w, y + h - r);
    this.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    this.lineTo(x + r, y + h);
    this.quadraticCurveTo(x, y + h, x, y + h - r);
    this.lineTo(x, y + r);
    this.quadraticCurveTo(x, y, x + r, y);
    this.closePath();
  };
  ctx.beginPath();
  ctx.roundRect(4, 4, 376, 88, 12);
  ctx.fill();
  ctx.strokeStyle = '#' + agent.color.toString(16).padStart(6, '0');
  ctx.lineWidth = 2;
  ctx.stroke();

  ctx.fillStyle = '#ebdcc8';
  ctx.font = 'bold 30px "Helvetica Neue", sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText(agent.name, 192, 44);

  ctx.fillStyle = '#' + agent.color.toString(16).padStart(6, '0');
  ctx.font = '18px "Helvetica Neue", sans-serif';
  ctx.fillText(agent.role, 192, 74);

  const tex = new THREE.CanvasTexture(c);
  tex.minFilter = THREE.LinearFilter;
  const plate = new THREE.Mesh(
    new THREE.PlaneGeometry(2.0, 0.5),
    new THREE.MeshBasicMaterial({ map: tex, transparent: true })
  );
  return plate;
}

// ============================================================
// Raycaster — hover + click
// ============================================================
const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();
const tooltip = document.getElementById('tooltip');

function getHitAgentGroup(event) {
  const rect = canvas.getBoundingClientRect();
  pointer.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
  pointer.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;
  raycaster.setFromCamera(pointer, camera);
  const hits = raycaster.intersectObjects(interactables, false);
  if (hits.length > 0) {
    return hits[0].object.userData.agentGroup || null;
  }
  return null;
}

canvas.addEventListener('mousemove', (e) => {
  const hit = getHitAgentGroup(e);
  if (hit) {
    canvas.style.cursor = 'pointer';
    const a = hit.userData.agent;
    tooltip.querySelector('.t-name').textContent = a.name;
    tooltip.querySelector('.t-role').textContent = a.role;
    tooltip.style.left = (e.clientX + 14) + 'px';
    tooltip.style.top = (e.clientY - 8) + 'px';
    tooltip.classList.add('show');
  } else {
    canvas.style.cursor = 'default';
    tooltip.classList.remove('show');
  }
});

let down = { x: 0, y: 0 };
canvas.addEventListener('pointerdown', (e) => { down.x = e.clientX; down.y = e.clientY; });
canvas.addEventListener('pointerup', (e) => {
  if (Math.hypot(e.clientX - down.x, e.clientY - down.y) > 4) return; // it was a drag
  const hit = getHitAgentGroup(e);
  if (hit) openPanel(hit.userData.agent);
});

// ============================================================
// Stats counter

function refreshStats() {
  const busy = AGENTS.filter(a => a.status === 'busy').length;
  const avail = AGENTS.filter(a => a.status === 'available').length;
  document.getElementById('busy-count').textContent = busy;
  document.getElementById('avail-count').textContent = avail;
}
refreshStats();

// ============================================================
// Animation loop
// ============================================================
const clock = new THREE.Clock();
function animate() {
  const t = clock.getElapsedTime();

  agentMeshes.forEach((mesh) => {
    const { led, ledLight, agent, plate, avatarGroup } = mesh.userData;

    // LED pulse for busy/alert agents
    if (agent.status === 'busy') {
      const p = 0.85 + 0.18 * Math.sin(t * 2.5 + mesh.position.x * 0.5);
      led.scale.setScalar(p);
      ledLight.intensity = 0.6 * p;
    } else if (agent.status === 'alert') {
      const p = 0.7 + 0.3 * Math.sin(t * 6);
      led.scale.setScalar(p);
      ledLight.intensity = 0.8 * p;
    } else {
      led.scale.setScalar(1);
    }

    // Subtle avatar "breathing"
    if (avatarGroup && avatarGroup.visible) {
      const breath = 1 + Math.sin(t * 1.5 + mesh.position.x) * 0.008;
      avatarGroup.scale.y = breath;
    }

    // Plate billboards to camera
    plate.lookAt(camera.position);
  });

  // Subtle pendant flicker
  pendants.forEach((p, i) => {
    p.intensity = 0.65 + 0.05 * Math.sin(t * 0.5 + i);
  });

  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(animate);
}

animate();
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// Hide loader once first frame rendered
requestAnimationFrame(() => {
  setTimeout(() => document.getElementById('loader').classList.add('hidden'), 200);
});

// PUBLIC API — update status from outside (console)
//   window.setAgentStatus('mql5-developer', 'busy', 'fix bug X')
//   window.setAgentStatus('quant-strategist', 'available')
// ============================================================
window.setAgentStatus = function(id, status, mission = null) {
  const mesh = agentMeshes.find(m => m.userData.agent.id === id);
  if (!mesh) { console.warn('Agent not found:', id); return; }
  const agent = mesh.userData.agent;
  agent.status = status;
  agent.mission = mission;
  mesh.userData.led.material.color.setHex(STATUS_COLORS[status]);
  mesh.userData.ledLight.color.setHex(STATUS_COLORS[status]);
  mesh.userData.avatarGroup.visible = status !== 'off';
  refreshStats();
  console.log(`✓ ${agent.name}: ${status}${mission ? ` (${mission})` : ''}`);
};
window.listAgents = () => AGENTS.map(a => ({ id: a.id, name: a.name, status: a.status, mission: a.mission }));

console.log('Update status: window.setAgentStatus(id, status, mission)');
